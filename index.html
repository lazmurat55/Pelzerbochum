<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APG BOCHUM SECURE PRO</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="APG Report">
    
    <style>
        :root { --bg: #000000; --card: #1e293b; --primary: #38bdf8; --blue-dark: #1e40af; --text: #f1f5f9; --danger: #ef4444; --success: #22c55e; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { background: var(--card); padding: 30px; border-radius: 20px; border: 2px solid var(--primary); width: 95%; max-width: 450px; text-align: center; }
        
        .card { width: 100%; max-width: 700px; background: var(--card); padding: 20px; border-radius: 20px; margin: auto; border: 1px solid rgba(56, 189, 248, 0.3); display: none; }
        .header { text-align: center; border-bottom: 3px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; }
        
        label { display: block; margin: 15px 0 5px; color: var(--primary); font-weight: bold; font-size: 14px; text-transform: uppercase; }
        select, input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; margin-bottom: 5px; }
        
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .schicht-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .schicht-btn { padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; }
        .schicht-btn.active { background: var(--primary); color: #0f172a; }
        
        .selected-worker { display: flex; justify-content: space-between; padding: 12px; background: rgba(56,189,248,0.1); border-radius: 10px; margin-top: 5px; border: 1px solid var(--primary); }
        
        .section-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid rgba(56,189,248,0.1); }
        .ft-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .ft-btn { padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; cursor: pointer; }
        .ft-btn.active { background: var(--blue-dark); color: white; border-color: var(--primary); }
        
        .main-btn { width: 100%; padding: 18px; background: var(--primary); color: #0f172a; border: none; border-radius: 12px; font-weight: bold; font-size: 17px; margin-top: 20px; cursor: pointer; }
        .main-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; color: #94a3b8; }
        .add-btn { width: 100%; padding: 12px; margin-top: 10px; background: transparent; border: 2px dashed var(--primary); color: var(--primary); border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        #workerOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; }
        .overlay-content { background: var(--card); width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; border-radius: 20px; padding: 20px; border: 1px solid var(--primary); }
        .worker-opt { padding: 14px; border-bottom: 1px solid #334155; cursor: pointer; }

        .dashboard-card { background: #000; border: 1px solid var(--primary); border-radius: 20px; padding: 20px; display: none; width: 100%; max-width: 1200px; margin: auto; }
        .reports-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        @media(min-width: 768px) { .reports-grid { grid-template-columns: repeat(2, 1fr); } }
        .report-box { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 15px; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card">
        <h2 style="color:var(--primary); margin-bottom: 20px;">APG LOGIN</h2>
        <input type="text" id="userInp" placeholder="Nachname">
        <input type="password" id="passInp" placeholder="Passwort">
        <button class="main-btn" id="loginBtn" onclick="checkLogin()">ANMELDEN</button>
        <p id="loginError" style="color:red; display:none; margin-top: 15px;">⚠️ Zugangsdaten falsch!</p>
    </div>
</div>

<div class="card" id="mainApp">
    <div class="header">
        <h2 style="margin:0;">Adler Pelzer Group</h2>
        <p id="currentUserDisplay" style="color:var(--success); font-size:14px; margin: 5px 0 0 0; font-weight: bold;"></p>
    </div>

    <div class="grid-2">
        <div>
            <label>Schicht</label>
            <div class="schicht-group">
                <button class="schicht-btn" id="btnA" onclick="setSchicht('A')">A</button>
                <button class="schicht-btn" id="btnB" onclick="setSchicht('B')">B</button>
                <button class="schicht-btn" id="btnC" onclick="setSchicht('C')">C</button>
            </div>
        </div>
        <div>
            <label>Art</label>
            <div class="schicht-group">
                <button class="schicht-btn type-btn" id="sFrueh" onclick="setSchichtType('Früh')">Früh</button>
                <button class="schicht-btn type-btn" id="sSpaet" onclick="setSchichtType('Spät')">Spät</button>
                <button class="schicht-btn type-btn" id="sNacht" onclick="setSchichtType('Nacht')">Nacht</button>
            </div>
        </div>
    </div>

    <label>Personal</label>
    <div id="workerDisplayContainer"></div>
    <button class="add-btn" onclick="openWorkerOverlay()">+ Mitarbeiter wählen</button>

    <div class="grid-2" style="margin-top:10px;">
        <div><label>Datum</label><input type="date" id="datum"></div>
        <div>
            <label>Anlage</label>
            <select id="anlage" onchange="onAnlageChange(this.value)">
                <option value="">Wählen...</option>
                <optgroup label="PUR">
                    <option value="PUR1">PUR 1</option><option value="PUR2">PUR 2</option><option value="PUR3">PUR 3</option>
                    <option value="PUR4">PUR 4</option><option value="PUR5">PUR 5</option><option value="PUR6">PUR 6</option>
                </optgroup>
                <optgroup label="Spritzguss">
                    <option value="IM1">IM 1</option><option value="IM2">IM 2</option><option value="CIM1">CIM 1</option>
                </optgroup>
                <option value="COM">Compound</option>
            </select>
        </div>
    </div>

    <div id="ftBox" style="display:none;">
        <label>Formträger (FT)</label>
        <div class="ft-grid">
            <button class="ft-btn" onclick="this.classList.toggle('active')">FT1</button>
            <button class="ft-btn" onclick="this.classList.toggle('active')">FT2</button>
            <button class="ft-btn" onclick="this.classList.toggle('active')">FT3</button>
            <button class="ft-btn" onclick="this.classList.toggle('active')">FT4</button>
        </div>
    </div>

    <div id="artikelContainer"></div>
    <button class="add-btn" id="addArtikelBtn" onclick="addArtikel()" disabled>+ Artikel hinzufügen</button>

    <button id="mainSendBtn" class="main-btn" onclick="processReport()" disabled>🚀 LIVE SPEICHERN</button>
</div>

<!-- Admin Dashboard -->
<div class="dashboard-card" id="adminPanel">
    <div class="header">
        <h1>APG Live Dashboard</h1>
        <p id="adminUserDisplay" style="color:var(--primary); font-weight: bold;"></p>
    </div>
    <button class="main-btn" onclick="loadAdminDashboard()">🔄 Aktualisieren</button>
    <div id="reportsContainer" class="reports-grid"></div>
</div>

<div id="workerOverlay">
    <div class="overlay-content">
        <h3>Mitarbeiter auswählen</h3>
        <div id="workerList"></div>
        <button class="main-btn" style="margin-top: 15px;" onclick="document.getElementById('workerOverlay').style.display='none'">OK</button>
    </div>
</div>

<script>
// --- KONFİGÜRASYON ---
const scriptURL = "https://script.google.com/macros/s/AKfycbwQKipv7Yym4HTLM3Mqkqsir6YzvkayND9zehItHKUTM1zeyBUeA0F4CEiCKVaxQ_AhVg/exec";
let currentSchicht = "B";
let currentSchichtType = "Früh";
let selectedStaff = [];
let loggedInUser = "";

const initialDB = {"Keskin":"517","Aldirmaz":"577","Uzun":"1433","Karali":"533","Katenz":"000"};
const workerData = {
    "A": ["Kunert M.", "Karali O.", "Stania D.", "Held D."],
    "B": ["Keskin Mur.", "Aldirmaz P.", "Uzun S.", "Kilic D.", "Maafi T."],
    "C": ["Beher T.", "Savas R.", "Rafo S.", "Mercan M."]
};

const codeData = {
    PUR: ["6-2-01 Temp. niedrig", "6-2-02 Schaum nio", "6-2-03 Einlegefehler", "6-2-04 Schussabbruch", "Sonstige"],
    Spritz: ["6-1-01 Anfahrschrott", "6-1-02 Mat-Umst.", "6-1-05 Überspritzung", "Sonstige"],
    COM: ["6-3-01 Anfahrschrott", "6-3-02 Mat-Fehler", "Sonstige"]
};

window.onload = () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('datum').value = today;
    // Butonların ilk durumdaki renklerini belirle
    document.getElementById('btnB').classList.add('active');
    document.getElementById('sFrueh').classList.add('active');
};

function checkLogin() {
    const u = document.getElementById('userInp').value.trim();
    const p = document.getElementById('passInp').value.trim();
    
    if (initialDB[u] && initialDB[u] === p) {
        loggedInUser = u;
        document.getElementById('loginScreen').style.display = 'none';
        
        // Form alanını herkese açıyoruz, adminler ek olarak alttaki dashboardu da görecek
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('currentUserDisplay').innerText = "Angemeldet als: " + u;
        
        if (u === "Keskin" || u === "Uzun") {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('adminUserDisplay').innerText = "Admin: " + u;
            loadAdminDashboard();
        }
        
        // Giriş sonrası personeli yükle ama liveCheck'i patlatma
        renderStaff();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
}

function setSchicht(s) {
    currentSchicht = s;
    document.querySelectorAll('.schicht-btn:not(.type-btn)').forEach(b => b.classList.toggle('active', b.innerText === s));
    selectedStaff = [];
    renderStaff();
}

function setSchichtType(t) {
    currentSchichtType = t;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.innerText === t));
}

function onAnlageChange(v) {
    document.getElementById('ftBox').style.display = v.startsWith("PUR") ? "block" : "none";
    document.getElementById('addArtikelBtn').disabled = (v === "");
    document.getElementById('artikelContainer').innerHTML = ""; 
    liveCheck();
}

function liveCheck() {
    const anlageSelect = document.getElementById('anlage');
    if (!anlageSelect) return;
    
    const valid = anlageSelect.value !== "" && selectedStaff.length > 0;
    document.getElementById('mainSendBtn').disabled = !valid;
}

function openWorkerOverlay() {
    const list = document.getElementById('workerList');
    list.innerHTML = workerData[currentSchicht].map(w => `
        <div class="worker-opt" onclick="toggleStaff('${w}')">
            ${selectedStaff.includes(w) ? '✅ ' : '⬜ '}${w}
        </div>
    `).join("");
    document.getElementById('workerOverlay').style.display = 'flex';
}

function toggleStaff(w) {
    if (selectedStaff.includes(w)) {
        selectedStaff = selectedStaff.filter(s => s !== w);
    } else {
        selectedStaff.push(w);
    }
    renderStaff();
    openWorkerOverlay(); // Overlay listesini güncelle
}

function renderStaff() {
    document.getElementById('workerDisplayContainer').innerHTML = selectedStaff.map(s => `
        <div class="selected-worker">
            <span>${s}</span>
            <span onclick="toggleStaff('${s}')" style="color:var(--danger); cursor:pointer; font-weight:bold; padding: 0 5px;">✕</span>
        </div>
    `).join("");
    liveCheck();
}

function addArtikel() {
    const container = document.getElementById('artikelContainer');
    const anlage = document.getElementById('anlage').value;
    if(!anlage) return;
    
    const type = anlage.startsWith("PUR") ? "PUR" : (anlage.startsWith("IM") ? "Spritz" : "COM");
    const codes = codeData[type];

    const html = `
        <div class="section-card">
            <input type="text" class="art-num" placeholder="Artikelnummer">
            <div class="grid-2">
                <input type="number" class="art-gut" placeholder="Gutteile">
                <input type="number" class="art-aus" placeholder="Ausschuss">
            </div>
            <label>Ausschuss Grund</label>
            <select class="art-grund">
                ${codes.map(c => `<option value="${c}">${c}</option>`).join("")}
            </select>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
}

async function processReport() {
    const btn = document.getElementById('mainSendBtn');
    const articles = Array.from(document.querySelectorAll('.section-card')).map(card => ({
        num: card.querySelector('.art-num').value,
        gut: card.querySelector('.art-gut').value,
        aus: card.querySelector('.art-aus').value,
        grund: card.querySelector('.art-grund').value
    }));

    if (articles.length === 0) {
        alert("Bitte mindestens einen Artikel hinzufügen!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Senden... ⏳";

    // Formträger verilerini topla (Eğer PUR ise)
    const activeFTs = Array.from(document.querySelectorAll('#ftBox .ft-btn.active')).map(b => b.innerText);
    const ftValue = activeFTs.length > 0 ? activeFTs.join(", ") : "-";

    const payload = {
        action: "saveReport",
        sender: loggedInUser,
        date: document.getElementById('datum').value,
        schicht: currentSchicht,
        type: currentSchichtType,
        anlage: document.getElementById('anlage').value,
        ft: ftValue,
        staff: selectedStaff.join(", "),
        articles: JSON.stringify(articles)
    };

    try {
        await fetch(scriptURL, { method: "POST", body: JSON.stringify(payload) });
        alert("✅ Rapor başarıyla sisteme kaydedildi!");
        location.reload(); 
    } catch(e) {
        alert("❌ Sunucu hatası! Kayıt yapılamadı.");
        btn.disabled = false;
        btn.innerText = "🚀 LIVE SPEICHERN";
    }
}

async function loadAdminDashboard() {
    const container = document.getElementById('reportsContainer');
    container.innerHTML = "Wird geladen... ⏳";
    try {
        const res = await fetch(scriptURL + "?action=getReports");
        const data = await res.json();
        if(data && data.reports) {
            container.innerHTML = data.reports.map(r => `
                <div class="report-box">
                    <b>${r.date} - ${r.anlage}</b> (FT: ${r.ft || '-'})<br>
                    <small>Mitarbeiter: ${r.staff}</small><hr style="border-color:#334155;">
                    <span>Gutteile: ${r.gutSum} | Ausschuss: ${r.ausSum}</span>
                </div>
            `).join("");
        } else {
            container.innerHTML = "Keine Berichte gefunden.";
        }
    } catch(e) { 
        container.innerHTML = "❌ Fehler beim Laden des Dashboards."; 
    }
}
</script>
</body>
</html>
